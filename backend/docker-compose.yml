# Local development infrastructure for the Meridia backend.
# Start with:  docker compose up -d db
# The API can also be run in a container; for day-to-day dev, run it with uv.

services:
  db:
    image: postgres:16-alpine
    container_name: meridia-db
    environment:
      POSTGRES_USER: meridia
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: meridia
    ports:
      - "5432:5432"
    volumes:
      - meridia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridia -d meridia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: meridia-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://meridia:devpass@db:5432/meridia
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    profiles: ["full"]  # only starts with:  docker compose --profile full up

volumes:
  meridia_pgdata:
