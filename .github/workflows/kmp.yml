name: KMP CI

# DEV-001 — shared multiplatform unit tests + Android debug build.
# Runs only when client code (or this workflow) changes, on PRs and on master.

on:
  pull_request:
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webApp/**"
      - "desktopApp/**"
      - "iosApp/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/kmp.yml"
  push:
    branches: [master]
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webApp/**"
      - "desktopApp/**"
      - "iosApp/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/kmp.yml"

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: shared tests + Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared multiplatform tests
        run: ./gradlew :shared:allTests --stacktrace

      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kmp-test-reports
          path: |
            shared/build/reports/tests/**
            shared/build/test-results/**
          if-no-files-found: ignore
