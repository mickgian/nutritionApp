name: Backend CI

# DEV-001 — lint + type-check + tests + coverage for the FastAPI backend.
# Runs only when backend code (or this workflow) changes, on PRs and on master.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest with coverage
        run: |
          uv run pytest \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --junitxml=pytest-junit.xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/pytest-junit.xml
          if-no-files-found: ignore
